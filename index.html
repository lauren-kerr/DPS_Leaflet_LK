<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Denver Social Vulnerability Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        #map {
            height: 600px;
        }

        /* ============================================================
        LEGEND
        ============================================================ */

        .info.legend {
            padding: 10px 12px;
            background: white;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            line-height: 22px;
            color: #333;
            max-height: 550px;
            overflow-y: auto;
        }

        .info.legend h4 {
            margin: 0 0 6px 0;
            font-size: 15px;
        }

        .info.legend .legend-section {
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        /* Square symbols */

        .info.legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 1;
        }

        /* Circle symbols */

        .info.legend .circle-symbol {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin: 3px 8px 0 3px;
        }

        /* Line symbols */

        .info.legend .line-symbol {
            width: 20px;
            height: 0;
            margin-top: 10px;
            border-top: 3px solid;
            background: none;
        }

        /* Polygon symbol */

        .info.legend .polygon-symbol {
            width: 18px;
            height: 18px;
            margin-right: 8px;
        }

        /* ============================================================
   NEIGHBORHOOD LABELS
   ============================================================ */

        .neighborhood-label {
            background: transparent;
            border: none;
            box-shadow: none;

            color: #000000;

            font-family: Arial, sans-serif !important;
            font-weight: 900 !important;
            font-style: normal !important;

            white-space: normal;

            text-align: center;

            line-height: 1.05;

            pointer-events: none;

            transition:
                font-size 0.15s ease,
                opacity 0.15s ease;
        }


        /* Force ALL text inside neighborhood labels to stay bold */
        .neighborhood-label,
        .neighborhood-label *,
        .leaflet-tooltip.neighborhood-label,
        .leaflet-tooltip.neighborhood-label * {
            font-family: Arial, sans-serif !important;
            font-weight: 900 !important;
            font-style: normal !important;
        }


        /* Slightly reinforce very small text */
        .neighborhood-label {
            -webkit-text-stroke: 0.15px currentColor;
        }


        .neighborhood-label::before {
            display: none;
        }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            opacity: 0.9;
        }

        .leaflet-popup {
            z-index: 1000 !important;
        }
    </style>
</head>


<body>

    <h1>Denver Social Vulnerability Map</h1>

    <div id="map"></div>


    <!-- Leaflet JavaScript -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>

        // ============================================================
        // CREATE MAP
        // ============================================================

        var map = L.map('map').setView(
            [39.7392, -104.9903],
            10
        );


        // ============================================================
        // BASEMAP
        // ============================================================

        var osm = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // ============================================================
        // CREATE MAP PANES
        // Higher zIndex = displayed above lower zIndex
        // ============================================================

        map.createPane('censusPane');
        map.createPane('neighborhoodPane');
        map.createPane('boundaryPane');
        map.createPane('highlightPane');
        map.createPane('pointPane');
        map.createPane('labelPane');

        map.getPane('labelPane').style.zIndex = 900;
        map.getPane('labelPane').style.pointerEvents = 'none';
        map.getPane('censusPane').style.zIndex = 300;
        map.getPane('neighborhoodPane').style.zIndex = 500;
        map.getPane('highlightPane').style.zIndex = 400;
        map.getPane('boundaryPane').style.zIndex = 700;
        map.getPane('pointPane').style.zIndex = 800;

        console.log(
            "Census z-index:",
            map.getPane('censusPane').style.zIndex
        );

        console.log(
            "Neighborhood z-index:",
            map.getPane('neighborhoodPane').style.zIndex
        );

        console.log(
            "Highlight z-index:",
            map.getPane('highlightPane').style.zIndex
        );

        console.log(
            "Boundary z-index:",
            map.getPane('boundaryPane').style.zIndex
        );

        console.log(
            "Point z-index:",
            map.getPane('pointPane').style.zIndex
        );
        // ============================================================
        // POPUP FUNCTION
        // ============================================================

        function createPopup(feature) {

            var properties = feature.properties;

            if (!properties) {
                return "<strong>No information available</strong>";
            }

            var popupContent = "<div>";

            for (var key in properties) {

                if (
                    properties[key] !== null &&
                    properties[key] !== undefined &&
                    properties[key] !== ""
                ) {

                    popupContent +=
                        "<strong>" +
                        key +
                        ":</strong> " +
                        properties[key] +
                        "<br>";
                }
            }

            popupContent += "</div>";

            return popupContent;
        }


        // ============================================================
        // SVI COLOR FUNCTION
        // ============================================================

        function getColor(value) {

            if (
                value === null ||
                value === undefined ||
                isNaN(value)
            ) {
                return "#808080";
            }

            if (value > 0.8) return "#F50000";
            if (value > 0.6) return "#F53D00";
            if (value > 0.4) return "#F57A00";
            if (value > 0.2) return "#F5B800";

            return "#F5F500";
        }


        // ============================================================
        // SCHOOL SRI COLOR FUNCTION
        // ============================================================

        function getSchoolColor(value) {

            if (
                value === null ||
                value === undefined ||
                isNaN(value)
            ) {
                return "#808080";
            }

            if (value > 0.8) return "#F50000";
            if (value > 0.6) return "#F53D00";
            if (value > 0.4) return "#F57A00";
            if (value > 0.2) return "#F5B800";

            return "#F5F500";
        }


        // ============================================================
        // SVI CENSUS TRACT STYLE
        // ============================================================

        function censusStyle(feature) {

            return {

                fillColor: getColor(
                    feature.properties.SVI
                ),

                weight: 0.5,

                opacity: 1,

                color: "#000000",

                fillOpacity: 1
            };
        }


        // ============================================================
        // LOAD ALL DATA
        // ============================================================

        Promise.all([

            // --------------------------------------------------------
            // CENSUS TRACTS
            // --------------------------------------------------------

            fetch('Data/Census_Tracts_SVI.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load Census_Tracts.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // COUNTY BOUNDARY
            // --------------------------------------------------------

            fetch('Data/County_Boundary.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load County_Boundary.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // NEIGHBORHOODS
            // --------------------------------------------------------

            // fetch('Data/Neighborhoods.geojson')
            //     .then(response => {

            //         if (!response.ok) {

            //             throw new Error(
            //                 "Could not load Neighborhoods.geojson: " +
            //                 response.status
            //             );
            //         }

            //         return response.json();
            //     }),

            fetch('Data/Neighborhoods.geojson?v=2')
                .then(response => {
                    console.log("FETCHED NEIGHBORHOODS FROM:", response.url);

                    if (!response.ok) {
                        throw new Error(
                            "Could not load Neighborhoods.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // SCHOOLS
            // --------------------------------------------------------

            fetch('Data/Schools.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load Schools.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // TRADITIONAL SCHOOLS
            // --------------------------------------------------------

            fetch('Data/Traditional_Schools.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load Traditional_Schools.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // ALTERNATIVE SCHOOLS
            // --------------------------------------------------------

            fetch('Data/Alternative_Schools.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load Alternative_Schools.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // RECREATION CENTERS
            // --------------------------------------------------------

            fetch('Data/Recreation_Centers.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load Recreation_Centers.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // SUD FACILITIES
            // --------------------------------------------------------

            fetch('Data/SUD_Facilities.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load SUD_Facilities.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // FIVE HIGHEST SVI CENSUS TRACTS
            // --------------------------------------------------------

            //     fetch('Data/Five_Highest_Census_Tracts.geojson')
            //         .then(response => {

            //             if (!response.ok) {

            //                 throw new Error(
            //                     "Could not load Five_Highest_Census_Tracts.geojson: " +
            //                     response.status
            //                 );
            //             }

            //             return response.json();
            //         })

            // ])
            fetch('Data/Five_Highest_Census_Tracts.geojson?v=2')
                .then(response => {
                    console.log("FETCHED FIVE HIGHEST FROM:", response.url);

                    if (!response.ok) {
                        throw new Error(
                            "Could not load Five_Highest_Census_Tracts.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                })
        ])
            // ============================================================
            // CREATE LEAFLET LAYERS
            // ============================================================

            .then(function (data) {

                console.log(
                    "All GeoJSON files loaded successfully."
                );


                // --------------------------------------------------------
                // STORE DATA
                // --------------------------------------------------------

                var censusData = data[0];
                var countyData = data[1];
                var neighborhoodData = data[2];
                var schoolsData = data[3];
                var traditionalSchoolsData = data[4];
                var alternativeSchoolsData = data[5];
                var recreationData = data[6];
                var sudData = data[7];
                var highestData = data[8];


                console.log(
                    "Census tract features:",
                    censusData.features.length
                );

                console.log(
                    "School features:",
                    schoolsData.features.length
                );


                // ========================================================
                // CENSUS TRACTS
                // ========================================================

                var censusTracts = L.geoJSON(
                    censusData,
                    {

                        pane: 'censusPane',

                        style: censusStyle,

                     onEachFeature: function (
                            feature,
                            layer
                        ) {
                        
                            var p = feature.properties;
                            layer.bindPopup(
                                "<b>Census Tract: </b>" + p.NAME.split(";")[0] +
                                "<br><b>Population: </b>" + p.E_TOTPOP.toLocaleString() +
                                "<br><b>Overall SVI Score: </b>" + (p.SVI * 100).toFixed(1) + "th percentile" +
                                "<br><b>Socioeconomic Status: </b>" + (p.RPL_THEME1 * 100).toFixed(1) + "th percentile" +
                                "<br><b>Household Characteristics: </b>" + (p.RPL_THEME2 * 100).toFixed(1) + "th percentile" +
                                "<br><b>Racial & Ethnic Minority Status: </b>" + (p.RPL_THEME3 * 100).toFixed(1) + "th percentile" +
                                "<br><b>Housing Type & Transportation: </b>" + (p.RPL_THEME4 * 100).toFixed(1) + "th percentile"
                            );
                        
                        }

                    }
                );


                // ========================================================
                // COUNTY BOUNDARY
                // ========================================================

                var countyBoundary = L.geoJSON(
                    countyData,
                    {

                        pane: 'boundaryPane',

                        style: {

                            color: "#000000",

                            weight: 5,

                            opacity: 1,

                            fill: false

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>County Boundary</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // NEIGHBORHOODS
                // ========================================================

                var neighborhoods = L.geoJSON(
                    neighborhoodData,
                    {

                        pane: 'neighborhoodPane',

                        style: {

                            color: "#000000",

                            weight: 2,

                            opacity: 1,

                            fill: false

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            // --------------------------------------------
                            // POPUP
                            // --------------------------------------------

                            layer.bindPopup(
                                "<strong>Neighborhood</strong><br><br>" +
                                createPopup(feature)
                            );


                            // --------------------------------------------
                            // NEIGHBORHOOD LABEL
                            // --------------------------------------------

                            if (
                                feature.properties &&
                                feature.properties.NBHD_NAME
                            ) {

                                layer.bindTooltip(
                                    feature.properties.NBHD_NAME,
                                    {
                                        permanent: true,
                                        direction: 'center',
                                        className: 'neighborhood-label',
                                        pane: 'labelPane',
                                        opacity: 0,
                                        interactive: false
                                    }
                                );

                            }

                        }

                    }
                );
                // ========================================================
                // DYNAMIC NEIGHBORHOOD LABEL PLACEMENT
                // ========================================================


                // --------------------------------------------------------
                // POINT-IN-RING TEST
                //
                // Used to determine whether a proposed label position
                // is actually inside the neighborhood polygon.
                // --------------------------------------------------------

                function pointInRing(point, ring) {

                    var x = point.lng;
                    var y = point.lat;

                    var inside = false;

                    for (
                        var i = 0, j = ring.length - 1;
                        i < ring.length;
                        j = i++
                    ) {

                        var xi = ring[i][0];
                        var yi = ring[i][1];

                        var xj = ring[j][0];
                        var yj = ring[j][1];


                        var intersects =
                            ((yi > y) !== (yj > y)) &&
                            (
                                x <
                                (xj - xi) *
                                (y - yi) /
                                ((yj - yi) || 0.0000001) +
                                xi
                            );


                        if (intersects) {
                            inside = !inside;
                        }

                    }

                    return inside;
                }


                // --------------------------------------------------------
                // CHECK ONE POLYGON
                //
                // GeoJSON polygons may contain:
                //
                // ring 0 = exterior boundary
                // ring 1+ = holes
                // --------------------------------------------------------

                function pointInPolygonCoordinates(
                    point,
                    polygonCoordinates
                ) {

                    if (
                        !polygonCoordinates ||
                        polygonCoordinates.length === 0
                    ) {
                        return false;
                    }


                    // Must be inside exterior ring

                    if (
                        !pointInRing(
                            point,
                            polygonCoordinates[0]
                        )
                    ) {

                        return false;

                    }


                    // Must NOT be inside a hole

                    for (
                        var i = 1;
                        i < polygonCoordinates.length;
                        i++
                    ) {

                        if (
                            pointInRing(
                                point,
                                polygonCoordinates[i]
                            )
                        ) {

                            return false;

                        }

                    }


                    return true;
                }


                // --------------------------------------------------------
                // CHECK WHETHER A LABEL BOX FITS INSIDE ITS NEIGHBORHOOD
                //
                // We test:
                // center
                // four corners
                // four edge midpoints
                //
                // This makes it much harder for text to cross a
                // neighborhood boundary.
                // --------------------------------------------------------

                function labelFitsInsideNeighborhood(
                    box,
                    feature
                ) {

                    if (
                        !feature ||
                        !feature.geometry
                    ) {

                        return true;

                    }


                    var geometry =
                        feature.geometry;


                    // Screen positions to test

                    var screenPoints = [

                        // Center
                        L.point(
                            (box.left + box.right) / 2,
                            (box.top + box.bottom) / 2
                        ),

                        // Corners
                        L.point(
                            box.left,
                            box.top
                        ),

                        L.point(
                            box.right,
                            box.top
                        ),

                        L.point(
                            box.left,
                            box.bottom
                        ),

                        L.point(
                            box.right,
                            box.bottom
                        ),

                        // Top midpoint
                        L.point(
                            (box.left + box.right) / 2,
                            box.top
                        ),

                        // Bottom midpoint
                        L.point(
                            (box.left + box.right) / 2,
                            box.bottom
                        ),

                        // Left midpoint
                        L.point(
                            box.left,
                            (box.top + box.bottom) / 2
                        ),

                        // Right midpoint
                        L.point(
                            box.right,
                            (box.top + box.bottom) / 2
                        )

                    ];


                    // Convert screen coordinates back to geographic coordinates

                    var geographicPoints =
                        screenPoints.map(function (point) {

                            return map.containerPointToLatLng(
                                point
                            );

                        });


                    // ====================================================
                    // NORMAL POLYGON
                    // ====================================================

                    if (
                        geometry.type === "Polygon"
                    ) {

                        return geographicPoints.every(
                            function (point) {

                                return pointInPolygonCoordinates(
                                    point,
                                    geometry.coordinates
                                );

                            }
                        );

                    }


                    // ====================================================
                    // MULTIPOLYGON
                    //
                    // All sample points must fit inside the SAME polygon
                    // component.
                    // ====================================================

                    if (
                        geometry.type === "MultiPolygon"
                    ) {

                        return geometry.coordinates.some(
                            function (polygonCoordinates) {

                                return geographicPoints.every(
                                    function (point) {

                                        return pointInPolygonCoordinates(
                                            point,
                                            polygonCoordinates
                                        );

                                    }
                                );

                            }
                        );

                    }


                    return true;
                }

                // ========================================================
                // CREATE POSSIBLE MULTI-LINE LABEL FORMATS
                // ========================================================

                function createLabelLayouts(text) {

                    var words =
                        text
                            .trim()
                            .split(/\s+/);


                    var layouts = [];


                    // ----------------------------------------------------
                    // OPTION 1:
                    // Entire neighborhood name on one line
                    // ----------------------------------------------------

                    layouts.push(
                        text
                    );


                    // ----------------------------------------------------
                    // OPTION 2:
                    // If there are multiple words,
                    // split roughly in half
                    // ----------------------------------------------------

                    if (words.length >= 2) {

                        var middle =
                            Math.ceil(
                                words.length / 2
                            );


                        var firstHalf =
                            words
                                .slice(0, middle)
                                .join(" ");


                        var secondHalf =
                            words
                                .slice(middle)
                                .join(" ");


                        if (secondHalf) {

                            layouts.push(
                                firstHalf +
                                "<br>" +
                                secondHalf
                            );

                        }

                    }


                    // ----------------------------------------------------
                    // OPTION 3:
                    // For 3+ words, try approximately three lines
                    // ----------------------------------------------------

                    if (words.length >= 3) {

                        var lines = [];

                        var wordsPerLine =
                            Math.ceil(
                                words.length / 3
                            );


                        for (
                            var i = 0;
                            i < words.length;
                            i += wordsPerLine
                        ) {

                            lines.push(
                                words
                                    .slice(
                                        i,
                                        i + wordsPerLine
                                    )
                                    .join(" ")
                            );

                        }


                        layouts.push(
                            lines.join("<br>")
                        );

                    }


                    // ----------------------------------------------------
                    // OPTION 4:
                    // One word per line
                    //
                    // Most compact horizontally
                    // ----------------------------------------------------

                    if (words.length >= 2) {

                        layouts.push(
                            words.join("<br>")
                        );

                    }


                    return layouts;
                }

                // ========================================================
                // UPDATE NEIGHBORHOOD LABELS
                // ========================================================

                function updateNeighborhoodLabels() {

                    var zoom =
                        map.getZoom();


                    // ====================================================
                    // HIDE LABELS WHEN ZOOMED OUT
                    // ====================================================

                    if (
                        zoom < 13 ||
                        !map.hasLayer(neighborhoods)
                    ) {

                        neighborhoods.eachLayer(
                            function (layer) {

                                var tooltip =
                                    layer.getTooltip();

                                if (tooltip) {

                                    tooltip.setOpacity(0);

                                }

                            }
                        );

                        return;

                    }



                    // ====================================================
                    // COLLECT POINT FEATURES
                    //
                    // Neighborhood labels will try to avoid these.
                    // ====================================================

                    var obstaclePoints = [];


                    function collectPointObstacles(
                        layerGroup
                    ) {

                        if (
                            !layerGroup ||
                            !map.hasLayer(layerGroup)
                        ) {

                            return;

                        }


                        layerGroup.eachLayer(
                            function (layer) {

                                if (
                                    layer.getLatLng
                                ) {

                                    var point =
                                        map.latLngToContainerPoint(
                                            layer.getLatLng()
                                        );


                                    obstaclePoints.push(
                                        point
                                    );

                                }

                            }
                        );

                    }


                    collectPointObstacles(
                        schools
                    );

                    collectPointObstacles(
                        traditionalSchools
                    );

                    collectPointObstacles(
                        alternativeSchools
                    );

                    collectPointObstacles(
                        recreationCenters
                    );

                    collectPointObstacles(
                        sudFacilities
                    );



                    // ====================================================
                    // TRACK LABELS ALREADY PLACED
                    // ====================================================

                    var occupiedBoxes = [];



                    // ====================================================
                    // BASE FONT SIZE
                    //
                    // Automatically increases as user zooms in.
                    // ====================================================

                    var preferredFontSize =
                        Math.min(
                            16,
                            9 + ((zoom - 13) * 1.5)
                        );



                    // ====================================================
                    // PROCESS EVERY NEIGHBORHOOD
                    // ====================================================

                    neighborhoods.eachLayer(
                        function (layer) {

                            var tooltip =
                                layer.getTooltip();


                            if (!tooltip) {
                                return;
                            }


                            layer.openTooltip();


                            var tooltipElement =
                                tooltip.getElement();
                            // =================================================
                            // ORIGINAL NEIGHBORHOOD NAME
                            // =================================================

                            var neighborhoodName =
                                layer.feature &&
                                    layer.feature.properties
                                    ? layer.feature.properties.NBHD_NAME
                                    : "";


                            var labelLayouts =
                                createLabelLayouts(
                                    neighborhoodName
                                );

                            if (!tooltipElement) {
                                return;
                            }


                            // Hide while calculating

                            tooltip.setOpacity(0);



                            // =================================================
                            // GET NEIGHBORHOOD CENTER
                            // =================================================

                            if (
                                !layer.getBounds
                            ) {

                                return;

                            }


                            var center =
                                layer
                                    .getBounds()
                                    .getCenter();


                            var centerPoint =
                                map.latLngToContainerPoint(
                                    center
                                );



                            // =================================================
                            // POSSIBLE LABEL POSITIONS
                            //
                            // Starts close to center and gradually expands.
                            // =================================================

                            var offsets = [

                                // Center
                                [0, 0],

                                // Slight movement
                                [0, -12],
                                [0, 12],
                                [-18, 0],
                                [18, 0],

                                // Diagonals
                                [-18, -12],
                                [18, -12],
                                [-18, 12],
                                [18, 12],

                                // Greater movement
                                [0, -25],
                                [0, 25],
                                [-35, 0],
                                [35, 0],

                                // Greater diagonals
                                [-30, -20],
                                [30, -20],
                                [-30, 20],
                                [30, 20],

                                // Even farther
                                [0, -40],
                                [0, 40],
                                [-50, 0],
                                [50, 0]

                            ];



                            var placed = false;

                            var fontSize =
                                preferredFontSize;



                            // =================================================
                            // TRY DIFFERENT FONT SIZES
                            // =================================================

                            while (
                                fontSize >= 5 &&
                                !placed
                            ) {

                                tooltipElement.style.fontSize =
                                    fontSize + "px";


                                // =================================================
                                // TRY EACH TEXT LAYOUT
                                //
                                // 1 line
                                // 2 lines
                                // 3 lines
                                // one word per line
                                // =================================================

                                for (
                                    var layoutIndex = 0;
                                    layoutIndex < labelLayouts.length;
                                    layoutIndex++
                                ) {

                                    var currentLayout =
                                        labelLayouts[
                                        layoutIndex
                                        ];


                                    // Apply this version of the label

                                    tooltipElement.innerHTML =
                                        "<strong>" +
                                        currentLayout +
                                        "</strong>";


                                    // Always force bold styling

                                    tooltipElement.style.fontWeight =
                                        "900";


                                    tooltipElement.style.textAlign =
                                        "center";


                                    tooltipElement.style.lineHeight =
                                        "1.05";


                                    // Force browser to calculate actual dimensions

                                    var width =
                                        tooltipElement.offsetWidth;


                                    var height =
                                        tooltipElement.offsetHeight;



                                    // =================================================
                                    // TRY EACH POSSIBLE POSITION
                                    // =================================================

                                    for (
                                        var i = 0;
                                        i < offsets.length;
                                        i++
                                    ) {

                                        var offsetX =
                                            offsets[i][0];


                                        var offsetY =
                                            offsets[i][1];


                                        var x =
                                            centerPoint.x +
                                            offsetX;


                                        var y =
                                            centerPoint.y +
                                            offsetY;



                                        // =============================================
                                        // BUILD LABEL BOUNDING BOX
                                        // =============================================

                                        var box = {

                                            left:
                                                x -
                                                width / 2,

                                            right:
                                                x +
                                                width / 2,

                                            top:
                                                y -
                                                height / 2,

                                            bottom:
                                                y +
                                                height / 2

                                        };


                                        var collision =
                                            false;



                                        // =============================================
                                        // CONDITION 1:
                                        // LABEL MUST FIT INSIDE NEIGHBORHOOD
                                        // =============================================

                                        if (
                                            !labelFitsInsideNeighborhood(
                                                box,
                                                layer.feature
                                            )
                                        ) {

                                            continue;

                                        }



                                        // =============================================
                                        // CONDITION 2:
                                        // AVOID POINT FEATURES
                                        // =============================================

                                        var pointPadding =
                                            10;


                                        for (
                                            var p = 0;
                                            p < obstaclePoints.length;
                                            p++
                                        ) {

                                            var obstacle =
                                                obstaclePoints[p];


                                            if (
                                                obstacle.x >
                                                box.left -
                                                pointPadding &&

                                                obstacle.x <
                                                box.right +
                                                pointPadding &&

                                                obstacle.y >
                                                box.top -
                                                pointPadding &&

                                                obstacle.y <
                                                box.bottom +
                                                pointPadding
                                            ) {

                                                collision =
                                                    true;

                                                break;

                                            }

                                        }


                                        if (collision) {

                                            continue;

                                        }



                                        // =============================================
                                        // CONDITION 3:
                                        // AVOID OTHER LABELS
                                        // =============================================

                                        var labelPadding =
                                            4;


                                        for (
                                            var b = 0;
                                            b < occupiedBoxes.length;
                                            b++
                                        ) {

                                            var other =
                                                occupiedBoxes[b];


                                            var overlaps =
                                                !(
                                                    box.right +
                                                    labelPadding <
                                                    other.left ||

                                                    box.left -
                                                    labelPadding >
                                                    other.right ||

                                                    box.bottom +
                                                    labelPadding <
                                                    other.top ||

                                                    box.top -
                                                    labelPadding >
                                                    other.bottom
                                                );


                                            if (overlaps) {

                                                collision =
                                                    true;

                                                break;

                                            }

                                        }


                                        if (collision) {

                                            continue;

                                        }



                                        // =============================================
                                        // VALID POSITION FOUND
                                        // =============================================

                                        var newPoint =
                                            L.point(
                                                x,
                                                y
                                            );


                                        var newLatLng =
                                            map.containerPointToLatLng(
                                                newPoint
                                            );


                                        tooltip.setLatLng(
                                            newLatLng
                                        );


                                        tooltip.setOpacity(
                                            1
                                        );


                                        occupiedBoxes.push(
                                            box
                                        );


                                        placed =
                                            true;


                                        break;

                                    }


                                    // Stop trying alternate layouts
                                    // once we found a valid solution

                                    if (placed) {

                                        break;

                                    }

                                }



                                // =================================================
                                // NOTHING FIT?
                                //
                                // Reduce font size and try:
                                //
                                // one-line
                                // two-line
                                // three-line
                                // vertical
                                //
                                // all over again.
                                // =================================================

                                if (!placed) {

                                    fontSize -= 1;

                                }

                            }



                            // =====================================================
                            // FALLBACK
                            //
                            // No collision-free placement was possible.
                            //
                            // Still ALWAYS show the neighborhood name.
                            //
                            // Use the most compact multi-line version and
                            // ALWAYS keep it bold.
                            // =====================================================

                            if (!placed) {

                                var fallbackFontSize =
                                    Math.max(
                                        7,
                                        Math.min(
                                            preferredFontSize,
                                            10
                                        )
                                    );


                                tooltipElement.style.fontSize =
                                    fallbackFontSize +
                                    "px";


                                tooltipElement.style.fontWeight =
                                    "900";


                                tooltipElement.style.textAlign =
                                    "center";


                                tooltipElement.style.lineHeight =
                                    "1.05";


                                // Use the narrowest available layout
                                // for the fallback.

                                tooltipElement.innerHTML =
                                    "<strong>" +
                                    labelLayouts[
                                    labelLayouts.length - 1
                                    ] +
                                    "</strong>";

                                tooltip.setLatLng(
                                    center
                                );


                                tooltip.setOpacity(
                                    1
                                );

                            }
                            // ========================================================
                            // CLOSE neighborhoods.eachLayer()
                            // ========================================================

                        }
                    );


                    // ========================================================
                    // CLOSE updateNeighborhoodLabels()
                    // ========================================================

                }
                // ========================================================
                // RECALCULATE LABELS WHEN MAP CHANGES
                // ========================================================

                map.on(
                    'zoomend moveend overlayadd overlayremove',
                    function () {

                        setTimeout(
                            updateNeighborhoodLabels,
                            50
                        );

                    }
                );

                // ========================================================
                // SCHOOLS
                // Colored by SRI_SCORE
                // ========================================================

                var schools = L.geoJSON(
                    schoolsData,
                    {
                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,
                            latlng
                        ) {

                            return L.circleMarker(
                                latlng,
                                {
                                    pane: 'pointPane',
                                    radius: 6,

                                    fillColor: getSchoolColor(
                                        feature.properties.SRI_SCORE
                                    ),

                                    color: "#000000",

                                    weight: 1,

                                    fillOpacity: 1

                                }
                            );

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>School</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // TRADITIONAL SCHOOLS
                // ========================================================

                var traditionalSchools = L.geoJSON(
                    traditionalSchoolsData,
                    {

                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,
                            latlng
                        ) {

                            return L.circleMarker(
                                latlng,
                                {
                                    pane: 'pointPane',
                                    radius: 6,

                                    fillColor: "#008000",

                                    color: "#FFFFFF",

                                    weight: 1,

                                    fillOpacity: 1

                                }
                            );

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>Traditional School</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // ALTERNATIVE SCHOOLS
                // ========================================================

                var alternativeSchools = L.geoJSON(
                    alternativeSchoolsData,
                    {

                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,
                            latlng
                        ) {

                            return L.circleMarker(
                                latlng,
                                {
                                    pane: 'pointPane',
                                    radius: 6,

                                    fillColor: "#800080",

                                    color: "#FFFFFF",

                                    weight: 1,

                                    fillOpacity: 1

                                }
                            );

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>Alternative School</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // RECREATION CENTERS
                // ========================================================

                var recreationCenters = L.geoJSON(
                    recreationData,
                    {

                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,
                            latlng
                        ) {

                            return L.circleMarker(
                                latlng,
                                {
                                    pane: 'pointPane',
                                    radius: 4,

                                    fillColor: "#4CE600",

                                    color: "#FFFFFF",

                                    weight: 1,

                                    fillOpacity: 1

                                }
                            );

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>Recreation Center</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // SUD FACILITIES
                // ========================================================

                var sudFacilities = L.geoJSON(
                    sudData,
                    {

                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,
                            latlng
                        ) {

                            return L.circleMarker(
                                latlng,
                                {
                                    pane: 'pointPane',
                                    radius: 4,

                                    fillColor: "#0070FF",

                                    color: "#FFFFFF",

                                    weight: 1,

                                    fillOpacity: 1

                                }
                            );

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>SUD Facility</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // FIVE HIGHEST SVI CENSUS TRACTS
                // ========================================================

                var fiveHighestCensusTracts = L.geoJSON(
                    highestData,
                    {

                        pane: 'highlightPane',

                        style: {

                            color: "#A80000",

                            weight: 3,

                            opacity: 1,

                            fillColor: "#A80000",

                            fillOpacity: 1

                        },

                       onEachFeature: function (
    feature,
    layer
) {

    var p = feature.properties;
    var name = p.tract_name ? p.tract_name.split(";")[0] : (p.NAME || "");
    layer.bindPopup(
        "<b>Highest SVI Census Tract</b>" +
        "<br><b>Name: </b>" + name +
        "<br><b>SVI Score: </b>" + (p.SVI * 100).toFixed(1) + "th percentile"
    );

}

                    }
                );


                // ========================================================
                // ADD INITIAL LAYERS TO MAP
                // ========================================================

                censusTracts.addTo(map);

                countyBoundary.addTo(map);

                schools.addTo(map);

                traditionalSchools.addTo(map);

                alternativeSchools.addTo(map);

                fiveHighestCensusTracts.addTo(map);

                neighborhoods.addTo(map);

                // Recreation Centers and SUD Facilities
                // are available in the layer control but
                // are OFF by default.


                if (censusTracts.getBounds().isValid()) {

                    map.fitBounds(
                        censusTracts.getBounds()
                    );

                }


                // ========================================================
                // INITIAL NEIGHBORHOOD LABEL PLACEMENT
                // ========================================================

                setTimeout(
                    updateNeighborhoodLabels,
                    100
                );


                // ========================================================
                // LAYER CONTROL
                // ========================================================


                // ========================================================
                // LAYER CONTROL
                // ========================================================

                L.control.layers(

                    {
                        "OpenStreetMap": osm
                    },

                    {
                        "Census Tracts": censusTracts,
                        "County Boundary": countyBoundary,
                        "Neighborhoods": neighborhoods,
                        "Schools": schools,
                        "Traditional Schools": traditionalSchools,
                        "Alternative Schools": alternativeSchools,
                        "Recreation Centers": recreationCenters,
                        "SUD Facilities": sudFacilities,
                        "Five Highest SVI Tracts": fiveHighestCensusTracts
                    },

                    {
                        position: 'topleft',
                        collapsed: false
                    }

                ).addTo(map);

                // ========================================================
                // LEGEND
                // ========================================================

                var legend = L.control({
                    position: 'bottomright'
                });


                legend.onAdd = function (map) {

                    var div = L.DomUtil.create(
                        'div',
                        'info legend'
                    );

                    return div;
                };


                legend.addTo(map);


                // ========================================================
                // UPDATE LEGEND
                // Changes automatically when layers are turned
                // on or off using the layer control.
                // ========================================================

                function updateLegend() {

                    var div = legend.getContainer();

                    div.innerHTML = '';


                    // ====================================================
                    // CENSUS TRACTS
                    // ====================================================

                    if (map.hasLayer(censusTracts)) {

                        div.innerHTML +=
                            '<div class="legend-section">' +
                            'Census Tracts - SVI Score' +
                            '</div>';


                        div.innerHTML +=
                            '<i style="background:#F5F500"></i>' +
                            'Low<br>';


                        div.innerHTML +=
                            '<i style="background:#F5B800"></i>' +
                            'Low - Moderate<br>';


                        div.innerHTML +=
                            '<i style="background:#F57A00"></i>' +
                            'Moderate<br>';


                        div.innerHTML +=
                            '<i style="background:#F53D00"></i>' +
                            'Moderate - High<br>';


                        div.innerHTML +=
                            '<i style="background:#F50000"></i>' +
                            'High<br>';
                    }


                    // ====================================================
                    // FIVE HIGHEST SVI CENSUS TRACTS
                    // ====================================================

                    if (map.hasLayer(fiveHighestCensusTracts)) {


                        div.innerHTML +=
                            '<i style="' +
                            'background:#A80000;' +
                            'border:1px solid #000000;' +
                            'width:18px;' +
                            'height:18px;' +
                            '"></i>' +
                            'Five Highest Census Tracts<br>';
                    }


                    // ====================================================
                    // SCHOOLS
                    // ====================================================

                    if (map.hasLayer(schools)) {

                        div.innerHTML +=
                            '<div class="legend-section">' +
                            'Schools — SRI Score' +
                            '</div>';


                        // Low SRI

                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="' +
                            'background:#F5F500;' +
                            'border:1px solid #000000' +
                            '"></i>' +
                            'Low<br>';


                        // Low - Moderate

                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="' +
                            'background:#F5B800;' +
                            'border:1px solid #000000' +
                            '"></i>' +
                            'Low - Moderate<br>';


                        // Moderate

                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="' +
                            'background:#F57A00;' +
                            'border:1px solid #000000' +
                            '"></i>' +
                            'Moderate<br>';


                        // Moderate - High

                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="' +
                            'background:#F53D00;' +
                            'border:1px solid #000000' +
                            '"></i>' +
                            'Moderate - High<br>';


                        // High

                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="' +
                            'background:#F50000;' +
                            'border:1px solid #000000' +
                            '"></i>' +
                            'High<br>';

                    }


                    // ====================================================
                    // TRADITIONAL SCHOOLS
                    // ====================================================

                    if (map.hasLayer(traditionalSchools)) {

                        div.innerHTML +=
                            '<div class="legend-section">' +
                            'School Types' +
                            '</div>';


                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="' +
                            'background:#008000;' +
                            'border:1px solid #FFFFFF' +
                            '"></i>' +
                            'Top 5 Traditional Schools<br>';
                    }


                    // ====================================================
                    // ALTERNATIVE SCHOOLS
                    // ====================================================

                    if (map.hasLayer(alternativeSchools)) {

                        if (!map.hasLayer(traditionalSchools)) {

                            div.innerHTML +=
                                '<div class="legend-section">' +
                                'School Types' +
                                '</div>';
                        }


                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="' +
                            'background:#800080;' +
                            'border:1px solid #FFFFFF' +
                            '"></i>' +
                            'Top 5 Alternative Schools<br>';
                    }


                    // ====================================================
                    // COUNTY BOUNDARY
                    // ====================================================

                    if (map.hasLayer(countyBoundary)) {

                        div.innerHTML +=
                            '<div class="legend-section">' +
                            'Boundaries' +
                            '</div>';


                        div.innerHTML +=
                            '<i class="line-symbol" ' +
                            'style="border-color:#000000; ' +
                            'border-top-width:3px">' +
                            '</i>' +
                            'County Boundary<br>';
                    }


                    // ====================================================
                    // NEIGHBORHOODS
                    // ====================================================

                    if (map.hasLayer(neighborhoods)) {

                        if (!map.hasLayer(countyBoundary)) {

                            div.innerHTML +=
                                '<div class="legend-section">' +
                                'Boundaries' +
                                '</div>';
                        }


                        div.innerHTML +=
                            '<i class="line-symbol" ' +
                            'style="border-color:#000000; ' +
                            'border-top-width:2px">' +
                            '</i>' +
                            'Neighborhood Boundary<br>';
                    }


                    // ====================================================
                    // RECREATION CENTERS
                    // Protective Layer
                    // ====================================================

                    if (map.hasLayer(recreationCenters)) {

                        div.innerHTML +=
                            '<div class="legend-section">' +
                            'Protective Layers' +
                            '</div>';


                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="' +
                            'background:#4CE600;' +
                            'border:1px solid #FFFFFF' +
                            '"></i>' +
                            'Recreation Centers<br>';
                    }


                    // ====================================================
                    // SUD FACILITIES
                    // Protective Layer
                    // ====================================================

                    if (map.hasLayer(sudFacilities)) {

                        if (!map.hasLayer(recreationCenters)) {

                            div.innerHTML +=
                                '<div class="legend-section">' +
                                'Protective Layers' +
                                '</div>';
                        }


                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="' +
                            'background:#0070FF;' +
                            'border:1px solid #FFFFFF' +
                            '"></i>' +
                            'SUD Facilities<br>';
                    }


                    // ====================================================
                    // CENSUS TRACT BOUNDARY
                    // ====================================================
                    // This is always included with Census Tracts.
                    // It is intentionally not given its own legend
                    // symbol because the SVI colors already explain
                    // the Census Tract layer.
                    // ====================================================


                }


                // ========================================================
                // INITIAL LEGEND
                // Shows all layers that are currently displayed.
                // ========================================================

                updateLegend();


                // ========================================================
                // UPDATE LEGEND WHEN A LAYER IS TURNED ON
                // ========================================================

                map.on('overlayadd', function () {

                    updateLegend();

                });


                // ========================================================
                // UPDATE LEGEND WHEN A LAYER IS TURNED OFF
                // ========================================================

                map.on('overlayremove', function () {

                    updateLegend();

                });


                console.log(
                    "Map layers and legend successfully created."
                );

            })


            // ============================================================
            // ERROR HANDLING
            // ============================================================

            .catch(function (error) {

                console.error(
                    "ERROR LOADING MAP DATA:",
                    error
                );

            });
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
    opacity: 0.9;
}

.leaflet-popup {
    z-index: 1000 !important;
}
    </script>

</body>

</html>
