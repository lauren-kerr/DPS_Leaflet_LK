        // ============================================================

        function createPopup(feature) {

            var properties = feature.properties;

            if (!properties) {
                return "<strong>No information available</strong>";
            }

            var popupContent = "<div>";

            for (var key in properties) {

                    properties[key] !== null &&
                    properties[key] !== undefined &&
                    properties[key] !== ""

                        "<strong>" +

        // ============================================================

        function getColor(value) {

            if (

                value === undefined ||
                isNaN(value)
            ) {
                return "#808080";
            }

            if (value > 0.8) return "#F50000";
            if (value > 0.6) return "#F53D00";
            if (value > 0.4) return "#F57A00";
            if (value > 0.2) return "#F5B800";

            return "#F5F500";

        ])
            // ============================================================

            .then(function (data) {

                console.log(

                console.log(

                // ========================================================

                var censusTracts = L.geoJSON(
                    censusData,
                    {

                        pane: 'censusPane',

                        style: censusStyle,

                     onEachFeature: function (
    feature,

) {

    var p = feature.properties;
    layer.bindPopup(

        "<br><b>No High School Diploma: </b>" + p.EP_NOHSDP.toFixed(1) + "%" +
        "<br><b>Uninsured: </b>" + p.EP_UNINSUR.toFixed(1) + "%" +
         "<br><b>Single-Parent Households: </b>" + p.EP_SNGPNT.toFixed(1) + "%"
          );

}

                    }
                );


                // ========================================================
                // COUNTY BOUNDARY
                // ========================================================

                var countyBoundary = L.geoJSON(
                    countyData,
                    {

                        pane: 'boundaryPane',

                        style: {

                // ========================================================

                            // --------------------------------------------

                            if (

                );
                // ========================================================
                // DYNAMIC NEIGHBORHOOD LABEL PLACEMENT
                // ========================================================


                // --------------------------------------------------------
                // POINT-IN-RING TEST
                //
                // Used to determine whether a proposed label position
                // is actually inside the neighborhood polygon.
                // --------------------------------------------------------

                function pointInRing(point, ring) {

                    var x = point.lng;
                    var y = point.lat;

                    var inside = false;

                    for (
                        var i = 0, j = ring.length - 1;
                        i < ring.length;
                        j = i++
                    ) {

                        var xi = ring[i][0];
                        var yi = ring[i][1];

                        var xj = ring[j][0];
                        var yj = ring[j][1];


                        var intersects =
                            ((yi > y) !== (yj > y)) &&
                            (
                                x <
                                (xj - xi) *
                                (y - yi) /
                                ((yj - yi) || 0.0000001) +
                                xi
                            );


                        if (intersects) {
                            inside = !inside;
                        }

                    }

                    return inside;
                }


                // --------------------------------------------------------
                // CHECK ONE POLYGON
                //
                // GeoJSON polygons may contain:
                //
                // ring 0 = exterior boundary
                // ring 1+ = holes
                // --------------------------------------------------------

                function pointInPolygonCoordinates(
                    point,
                    polygonCoordinates
                ) {

                    if (
                        !polygonCoordinates ||
                        polygonCoordinates.length === 0
                    ) {
                        return false;
                    }


                    // Must be inside exterior ring

                    if (
                        !pointInRing(
                            point,
                            polygonCoordinates[0]
                        )
                    ) {

                        return false;

                    }


                    // Must NOT be inside a hole

                    for (
                        var i = 1;
                        i < polygonCoordinates.length;
                        i++
                    ) {

                        if (
                            pointInRing(
                                point,
                                polygonCoordinates[i]
                            )
                        ) {

                            return false;

                        }

                    }


                    return true;
                }


                // --------------------------------------------------------
                // CHECK WHETHER A LABEL BOX FITS INSIDE ITS NEIGHBORHOOD
                //
                // We test:
                // center
                // four corners
                // four edge midpoints
                //
                // This makes it much harder for text to cross a
                // neighborhood boundary.
                // --------------------------------------------------------

                function labelFitsInsideNeighborhood(
                    box,
                    feature
                ) {

                    if (
                        !feature ||
                        !feature.geometry
                    ) {

                        return true;

                    }


                    var geometry =
                        feature.geometry;


                    // Screen positions to test

                    var screenPoints = [

                        // Center
                        L.point(
                            (box.left + box.right) / 2,
                            (box.top + box.bottom) / 2
                        ),

                        // Corners
                        L.point(
                            box.left,
                            box.top
                        ),

                        L.point(
                            box.right,
                            box.top
                        ),

                        L.point(
                            box.left,
                            box.bottom
                        ),

                        L.point(
                            box.right,
                            box.bottom
                        ),

                        // Top midpoint
                        L.point(
                            (box.left + box.right) / 2,
                            box.top
                        ),

                        // Bottom midpoint
                        L.point(
                            (box.left + box.right) / 2,
                            box.bottom
                        ),

                        // Left midpoint
                        L.point(
                            box.left,
                            (box.top + box.bottom) / 2
                        ),

                        // Right midpoint
                        L.point(
                            box.right,
                            (box.top + box.bottom) / 2
                        )

                    ];


                    // Convert screen coordinates back to geographic coordinates

                    var geographicPoints =
                        screenPoints.map(function (point) {

                            return map.containerPointToLatLng(
                                point
                            );

                        });


                    // ====================================================
                    // NORMAL POLYGON
                    // ====================================================

                    if (
                        geometry.type === "Polygon"
                    ) {

                        return geographicPoints.every(
                            function (point) {

                                return pointInPolygonCoordinates(
                                    point,
                                    geometry.coordinates
                                );

                            }
                        );

                    }


                    // ====================================================
                    // MULTIPOLYGON
                    //
                    // All sample points must fit inside the SAME polygon
                    // component.
                    // ====================================================

                    if (
                        geometry.type === "MultiPolygon"
                    ) {

                        return geometry.coordinates.some(
                            function (polygonCoordinates) {

                                return geographicPoints.every(
                                    function (point) {

                                        return pointInPolygonCoordinates(
                                            point,
                                            polygonCoordinates
                                        );

                                    }
                                );

                            }
                        );

                    }


                    return true;
                }

                // ========================================================
                // CREATE POSSIBLE MULTI-LINE LABEL FORMATS
                // ========================================================

                function createLabelLayouts(text) {

                    var words =
                        text
                            .trim()
                            .split(/\s+/);


                    var layouts = [];


                    // ----------------------------------------------------
                    // OPTION 1:
                    // Entire neighborhood name on one line
                    // ----------------------------------------------------

                    layouts.push(
                        text
                    );


                    // ----------------------------------------------------
                    // OPTION 2:
                    // If there are multiple words,
                    // split roughly in half
                    // ----------------------------------------------------

                    if (words.length >= 2) {

                        var middle =
                            Math.ceil(
                                words.length / 2
                            );


                        var firstHalf =
                            words
                                .slice(0, middle)
                                .join(" ");


                        var secondHalf =
                            words
                                .slice(middle)
                                .join(" ");


                        if (secondHalf) {

                            layouts.push(
                                firstHalf +
                                "<br>" +
                                secondHalf
                            );

                        }

                    }


                    // ----------------------------------------------------
                    // OPTION 3:
                    // For 3+ words, try approximately three lines
                    // ----------------------------------------------------

                    if (words.length >= 3) {

                        var lines = [];

                        var wordsPerLine =
                            Math.ceil(
                                words.length / 3
                            );


                        for (
                            var i = 0;
                            i < words.length;
                            i += wordsPerLine
                        ) {

                            lines.push(
                                words
                                    .slice(
                                        i,
                                        i + wordsPerLine
                                    )
                                    .join(" ")
                            );

                        }


                        layouts.push(
                            lines.join("<br>")
                        );

                    }


                    // ----------------------------------------------------
                    // OPTION 4:
                    // One word per line
                    //
                    // Most compact horizontally
                    // ----------------------------------------------------

                    if (words.length >= 2) {

                        layouts.push(
                            words.join("<br>")
                        );

                    }


                    return layouts;
                }

                // ========================================================
                // UPDATE NEIGHBORHOOD LABELS
                // ========================================================

                function updateNeighborhoodLabels() {

                        return;

                    }



                    // ====================================================
                    // COLLECT POINT FEATURES
                    //
                    // Neighborhood labels will try to avoid these.
                    // ====================================================

                    var obstaclePoints = [];


                    function collectPointObstacles(
                        layerGroup
                    ) {

                        if (
                            !layerGroup ||
                            !map.hasLayer(layerGroup)
                        ) {

                            return;

                        }


                        layerGroup.eachLayer(
                            function (layer) {

                                if (
                                    layer.getLatLng
                                ) {

                                    var point =
                                        map.latLngToContainerPoint(
                                            layer.getLatLng()
                                        );


                                    obstaclePoints.push(
                                        point
                                    );

                                }

                            }
                        );

                    }


                    collectPointObstacles(
                        traditionalSchools
                    );

                    collectPointObstacles(
                        alternativePathwaySchools
                    );

                    collectPointObstacles(
                        recreationCenters
                    );

                    collectPointObstacles(
                        sudFacilities
                    );



                    // ====================================================
                    // TRACK LABELS ALREADY PLACED
                    // ====================================================

                    var occupiedBoxes = [];



                    // ====================================================
                    // BASE FONT SIZE
                    //
                    // Automatically increases as user zooms in.
                    // ====================================================

                    var preferredFontSize =
                        Math.min(
                            16,
                            9 + ((zoom - 13) * 1.5)
                        );



                    // ====================================================
                    // PROCESS EVERY NEIGHBORHOOD
                    // ====================================================

                    neighborhoods.eachLayer(
                        function (layer) {

                            var tooltip =
                                layer.getTooltip();


                            if (!tooltip) {
                                return;
                            }


                            layer.openTooltip();


                            var tooltipElement =
                                tooltip.getElement();
                            // =================================================
                            // ORIGINAL NEIGHBORHOOD NAME
                            // =================================================

                            var neighborhoodName =
                                layer.feature &&
                                    layer.feature.properties
                                    ? layer.feature.properties.NBHD_NAME
                                    : "";


                            var labelLayouts =
                                createLabelLayouts(
                                    neighborhoodName
                                );

                            if (!tooltipElement) {
                                return;
                            }


                            // Hide while calculating

                            tooltip.setOpacity(0);



                            // =================================================
                            // GET NEIGHBORHOOD CENTER
                            // =================================================

                            if (
                                !layer.getBounds
                            ) {

                                return;

                            }


                            var center =
                                layer
                                    .getBounds()
                                    .getCenter();


                            var centerPoint =
                                map.latLngToContainerPoint(
                                    center
                                );



                            // =================================================
                            // POSSIBLE LABEL POSITIONS
                            //
                            // Starts close to center and gradually expands.
                            // =================================================

                            var offsets = [

                                // Center
                                [0, 0],

                                // Slight movement
                                [0, -12],
                                [0, 12],
                                [-18, 0],
                                [18, 0],

                                // Diagonals
                                [-18, -12],
                                [18, -12],
                                [-18, 12],
                                [18, 12],

                                // Greater movement
                                [0, -25],
                                [0, 25],
                                [-35, 0],
                                [35, 0],

                                // Greater diagonals
                                [-30, -20],
                                [30, -20],
                                [-30, 20],
                                [30, 20],

                                // Even farther
                                [0, -40],
                                [0, 40],
                                [-50, 0],
                                [50, 0]

                            ];



                            var placed = false;

                            var fontSize =
                                preferredFontSize;



                            // =================================================
                            // TRY DIFFERENT FONT SIZES
                            // =================================================

                            while (
                                fontSize >= 5 &&
                                !placed
                            ) {

                                tooltipElement.style.fontSize =
                                    fontSize + "px";


                                // =================================================
                                // TRY EACH TEXT LAYOUT
                                //
                                // 1 line
                                // 2 lines
                                // 3 lines
                                // one word per line
                                // =================================================

                                for (
                                    var layoutIndex = 0;
                                    layoutIndex < labelLayouts.length;
                                    layoutIndex++
                                ) {

                                    var currentLayout =
                                        labelLayouts[
                                        layoutIndex
                                        ];


                                    // Apply this version of the label

                                    tooltipElement.innerHTML =
                                        "<strong>" +
                                        currentLayout +
                                        "</strong>";


                                    // Always force bold styling

                                    tooltipElement.style.fontWeight =
                                        "900";


                                    tooltipElement.style.textAlign =
                                        "center";


                                    tooltipElement.style.lineHeight =
                                        "1.05";


                                    // Force browser to calculate actual dimensions

                                    var width =
                                        tooltipElement.offsetWidth;


                                    var height =
                                        tooltipElement.offsetHeight;



                                    // =================================================
                                    // TRY EACH POSSIBLE POSITION
                                    // =================================================

                                    for (
                                        var i = 0;
                                        i < offsets.length;
                                        i++
                                    ) {

                                        var offsetX =
                                            offsets[i][0];


                                        var offsetY =
                                            offsets[i][1];


                                        var x =
                                            centerPoint.x +
                                            offsetX;


                                        var y =
                                            centerPoint.y +
                                            offsetY;



                                        // =============================================
                                        // BUILD LABEL BOUNDING BOX
                                        // =============================================

                                        var box = {

                                            left:
                                                x -
                                                width / 2,

                                            right:
                                                x +
                                                width / 2,

                                            top:
                                                y -
                                                height / 2,

                                            bottom:
                                                y +
                                                height / 2

                                        };


                                        var collision =
                                            false;



                                        // =============================================
                                        // CONDITION 1:
                                        // LABEL MUST FIT INSIDE NEIGHBORHOOD
                                        // =============================================

                                        if (
                                            !labelFitsInsideNeighborhood(
                                                box,
                                                layer.feature
                                            )
                                        ) {

                                            continue;

                                        }



                                        // =============================================
                                        // CONDITION 2:
                                        // AVOID POINT FEATURES
                                        // =============================================

                                        var pointPadding =
                                            10;


                                        for (
                                            var p = 0;
                                            p < obstaclePoints.length;
                                            p++
                                        ) {

                                            var obstacle =
                                                obstaclePoints[p];


                                            if (
                                                obstacle.x >
                                                box.left -
                                                pointPadding &&

                                                obstacle.x <
                                                box.right +
                                                pointPadding &&

                                                obstacle.y >
                                                box.top -
                                                pointPadding &&

                                                obstacle.y <
                                                box.bottom +
                                                pointPadding
                                            ) {

                                                collision =
                                                    true;

                                                break;

                                            }

                                        }


                                        if (collision) {

                                            continue;

                                        }



                                        // =============================================
                                        // CONDITION 3:
                                        // AVOID OTHER LABELS
                                        // =============================================

                                        var labelPadding =
                                            4;


                                        for (
                                            var b = 0;
                                            b < occupiedBoxes.length;
                                            b++
                                        ) {

                                            var other =
                                                occupiedBoxes[b];


                                            var overlaps =
                                                !(
                                                    box.right +
                                                    labelPadding <
                                                    other.left ||

                                                    box.left -
                                                    labelPadding >
                                                    other.right ||

                                                    box.bottom +
                                                    labelPadding <
                                                    other.top ||

                                                    box.top -
                                                    labelPadding >
                                                    other.bottom
                                                );


                                            if (overlaps) {

                                                collision =
                                                    true;

                                                break;

                                            }

                                        }


                                        if (collision) {

                                            continue;

                                        }



                                        // =============================================
                                        // VALID POSITION FOUND
                                        // =============================================

                                        var newPoint =
                                            L.point(
                                                x,
                                                y
                                            );


                                        var newLatLng =
                                            map.containerPointToLatLng(
                                                newPoint
                                            );


                                        tooltip.setLatLng(
                                            newLatLng
                                        );


                                        tooltip.setOpacity(
                                            1
                                        );


                                        occupiedBoxes.push(
                                            box
                                        );


                                        placed =
                                            true;


                                        break;

                                    }


                                    // Stop trying alternate layouts
                                    // once we found a valid solution

                                    if (placed) {

                                        break;

                                    }

                                }



                                // =================================================
                                // NOTHING FIT?
                                //
                                // Reduce font size and try:
                                //
                                // one-line
                                // two-line
                                // three-line
                                // vertical
                                //
                                // all over again.
                                // =================================================

                                if (!placed) {

                                    fontSize -= 1;

                                }

                            }



                            // =====================================================
                            // FALLBACK
                            //
                            // No collision-free placement was possible.
                            //
                            // Still ALWAYS show the neighborhood name.
                            //
                            // Use the most compact multi-line version and
                            // ALWAYS keep it bold.
                            // =====================================================

                            if (!placed) {

                                var fallbackFontSize =
                                    Math.max(
                                        7,
                                        Math.min(
                                            preferredFontSize,
                                            10
                                        )
                                    );


                                tooltipElement.style.fontSize =
                                    fallbackFontSize +
                                    "px";


                                tooltipElement.style.fontWeight =
                                    "900";


                                tooltipElement.style.textAlign =
                                    "center";


                                tooltipElement.style.lineHeight =
                                    "1.05";


                                // Use the narrowest available layout
                                // for the fallback.

                                tooltipElement.innerHTML =
                                    "<strong>" +
                                    labelLayouts[
                                    labelLayouts.length - 1
                                    ] +
                                    "</strong>";

                                tooltip.setLatLng(
                                    center
                                );


                                tooltip.setOpacity(
                                    1
                                );

                            }
                            // ========================================================
                            // CLOSE neighborhoods.eachLayer()
                            // ========================================================

                        }
                    );


                    // ========================================================
                    // CLOSE updateNeighborhoodLabels()
                    // ========================================================

                }
                // ========================================================
                // RECALCULATE LABELS WHEN MAP CHANGES
                // ========================================================

                map.on(
                    'zoomend moveend overlayadd overlayremove',
                    function () {

                        setTimeout(
                            updateNeighborhoodLabels,
                            50
                        );

                    }
                );

                // ========================================================
                // SCHOOLS
                // Colored by SRI_SCORE
                // ========================================================

                // Two school layers, both built from Schools.geojson and
                // coloured by SRI score. The curated Traditional_Schools
                // / Alternative_Schools files are used only to (a) split
                // the layers and (b) flag the highlighted "top 5".
                var schoolName = function (props) {
                    return (props.school_nam || props.school_n_1 || "")
                        .trim()
                        .toLowerCase();
                };

                var nameSetFrom = function (fc) {
                    var set = {};
                    fc.features.forEach(function (f) {
                        var n = schoolName(f.properties);
                        if (n) {
                            set[n] = true;
                        }
                    });
                    return set;
                };

                var topTraditionalNames = nameSetFrom(traditionalSchoolsData);
                var alternativeNames = nameSetFrom(alternativeSchoolsData);

                function makeSchoolLayer(opts) {

                    return L.geoJSON(
                        schoolsData,
                        {
                            pane: 'pointPane',

                            filter: opts.filter,

                            pointToLayer: function (feature, latlng) {

                                var highlight = opts.isHighlighted(
                                    feature.properties
                                );

                                var size = highlight ? 30 : 26;
                                var fill = getSchoolColor(
                                    feature.properties.SRI_SCORE
                                );
                                var border = highlight
                                    ? opts.highlightColor
                                    : "#000000";
                                var borderWidth = highlight ? 3 : 1;

                                return L.marker(
                                    latlng,
                                    {
                                        pane: 'pointPane',
                                        icon: L.divIcon({
                                            className: '',
                                            html:
                                                '<div style="' +
                                                'width:' + size + 'px;' +
                                                'height:' + size + 'px;' +
                                                'border-radius:50%;' +
                                                'background:' + fill + ';' +
                                                'border:' + borderWidth +
                                                'px solid ' + border + ';' +
                                                'box-sizing:border-box;' +
                                                'display:flex;' +
                                                'align-items:center;' +
                                                'justify-content:center;' +
                                                'font-size:' +
                                                (highlight ? 16 : 14) + 'px;' +
                                                'line-height:1;">🏫</div>',
                                            iconSize: [size, size],
                                            iconAnchor: [size / 2, size / 2],
                                            popupAnchor: [0, -size / 2]
                                        })
                                    }
                                );

                            },

                            onEachFeature: function (feature, layer) {

                                var p = feature.properties;
                                layer.bindPopup(
                                    "<b>School: </b>" + (p.school_n_1 || p.school_nam || "") +
                                    "<br><b>Neighborhood: </b>" + (p.NBHD_NAME || "N/A") +
                                    "<br><b>School Type: </b>" + (p.classifica || "N/A") +
                                    "<br><b>Address: </b>" + (p.address_li || "") + ", " + (p.city || "") + " " + (p.zip || "") +
                                    "<br><b>SRI Score: </b>" + p.SRI_SCORE.toFixed(2)
                                );

                            }
                        }
                    );
                }


                // ========================================================
                // TRADITIONAL SCHOOLS
                // Everything except the curated Alternative/Pathway list.
                // Top 5 (Traditional_Schools.geojson) get a thick green
                // border and a larger radius.
                // ========================================================

                var traditionalSchools = makeSchoolLayer({
                    filter: function (feature) {
                        return !alternativeNames[
                            schoolName(feature.properties)
                        ];
                    },
                    isHighlighted: function (props) {
                        return !!topTraditionalNames[schoolName(props)];
                    },
                    highlightColor: "#008000"
                });


                // ========================================================
                // ALTERNATIVE / PATHWAY SCHOOLS
                // The curated Alternative_Schools.geojson list. All of
                // them get a thick purple border and a larger radius.
                // ========================================================

                var alternativePathwaySchools = makeSchoolLayer({
                    filter: function (feature) {
                        return !!alternativeNames[
                            schoolName(feature.properties)
                        ];
                    },
                    isHighlighted: function () {
                        return true;
                    },
                    highlightColor: "#800080"
                });

                console.log(
                    "Traditional Schools features:",
                    traditionalSchools.getLayers().length
                );

                console.log(
                    "Alternative/Pathway Schools features:",
                    alternativePathwaySchools.getLayers().length
                );


                // ========================================================
                // RECREATION CENTERS
                // ========================================================

                var recreationCenters = L.geoJSON(
                    recreationData,
                    {

                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,
                            latlng
                        ) {

                            return L.marker(
                                latlng,
                                {
                                    pane: 'pointPane',
                                    icon: emojiDivIcon('🌟')
                                }
                            );

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            var p = feature.properties;
                            layer.bindPopup(
                                "<b>Recreation Center: </b>" + (p.REC_NAME || "") +
                                "<br><b>Type: </b>" + (p.REC_TYPE || "N/A") +
                                "<br><b>Address: </b>" + (p.ADDRESS_LI || "") + ", Denver " + (p.ZIP || "") +
                                "<br><b>Phone: </b>" + (p.PHONE || "N/A") +
                                "<br><b>Programs: </b>" + (p.MARKETED_P || "N/A")
                            );

                        }

                    }
                );


                // ========================================================
                // SUD FACILITIES
                // ========================================================

                var sudFacilities = L.geoJSON(
                    sudData,
                    {

                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,
                            latlng
                        ) {

                            return L.marker(
                                latlng,
                                {
                                    pane: 'pointPane',
                                    icon: emojiDivIcon('🏢')
                                }
                            );

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            var p = feature.properties;
                            var services = [];
                            if (p.SA == 1) services.push("Substance Abuse");
                            if (p.MU == 1) services.push("Mental Health");
                            if (p.DT == 1) services.push("Detox");
                            if (p.HH == 1) services.push("Halfway House");
                            if (p.OIT == 1) services.push("Opioid Treatment");

                            layer.bindPopup(
                                "<b>Treatment Facility: </b>" + (p.FacilityNa || "") +
                                "<br><b>Address: </b>" + (p.Address || "") +
                                "<br><b>Services: </b>" + (services.length > 0 ? services.join(", ") : "N/A")
                            );

                        }

                    }
                );


                // ========================================================
                // FARMERS MARKETS
                // ========================================================

                var farmersMarkets = L.geoJSON(
                    farmersMarketsData,
                    {
                        pane: 'pointPane',
                        pointToLayer: function (feature, latlng) {
                            return L.marker(latlng, {
                                pane: 'pointPane',
                                icon: emojiDivIcon('🥕')
                            });
                        },
                        onEachFeature: function (feature, layer) {
                            var p = feature.properties;
                            layer.bindPopup(
                                "<b>Farmers Market: </b>" + (p.NAME || "") +
                                "<br><b>Address: </b>" + (p.ADDRESS || "") + ", " + (p.CITY || "") + " " + (p.ZIP || "") +
                                "<br><b>Season: </b>" + (p.STATUS || "N/A") +
                                "<br><b>SNAP Accepted: </b>" + (p.SNAP || "N/A") +
                                "<br><b>Double Up Food Bucks: </b>" + (p.DOUBLE_UP_ || "N/A")
                            );
                        }
                    }
                );


                // ========================================================
                // PARKS
                // ========================================================

                var parks = L.geoJSON(
                    parksData,
                    {
                        pane: 'neighborhoodPane',
                        style: {
                            color: "#228B22",
                            weight: 1.5,
                            opacity: 1,
                            dashArray: "4 4",
                            fillColor: "#228B22",
                            fillOpacity: 0.15
                        },
                        onEachFeature: function (feature, layer) {
                            var p = feature.properties;
                            layer.bindPopup(
                                "<b>Park: </b>" + (p.LOCATION || p.FORMAL_NAME || "") +
                                "<br><b>Type: </b>" + (p.PARK_CLASS || "N/A") +
                                "<br><b>Address: </b>" + (p.ADDRESS_LINE1 || "") + ", " + (p.CITY || "") + " " + (p.ZIP || "") +
                                "<br><b>Acreage: </b>" + (p.GIS_ACRES ? p.GIS_ACRES.toFixed(1) + " acres" : "N/A")
                            );

                            layer.on('mouseover', function () {
                                this.setStyle({ fillOpacity: 0.4 });
                            });

                            layer.on('mouseout', function () {
                                this.setStyle({ fillOpacity: 0.15 });
                            });
                        }
                    }
                );


                // ========================================================
                // SKATE PARKS
                // ========================================================
                // Source geometry is polygons; render each as a single
                // marker placed at the polygon centroid.

                var skateParkPoints = {
                    type: "FeatureCollection",
                    features: skateParksData.features.map(function (f) {

                        var ring = f.geometry.coordinates[0];
                        var sx = 0;
                        var sy = 0;

                        for (var i = 0; i < ring.length; i++) {
                            sx += ring[i][0];
                            sy += ring[i][1];
                        }

                        return {
                            type: "Feature",
                            properties: f.properties,
                            geometry: {
                                type: "Point",
                                coordinates: [
                                    sx / ring.length,
                                    sy / ring.length
                                ]
                            }
                        };
                    })
                };

                var skateParks = L.geoJSON(
                    skateParkPoints,
                    {
                        pane: 'pointPane',
                        pointToLayer: function (feature, latlng) {
                            return L.marker(latlng, {
                                pane: 'pointPane',
                                icon: emojiDivIcon('🛹')
                            });
                        },
                        onEachFeature: function (feature, layer) {
                            var p = feature.properties;
                            layer.bindPopup(
                                "<b>Skate Park: </b>" + (p.LOCATION || "")
                            );
                        }
                    }
                );


                // ========================================================
                // SWIMMING POOLS
                // ========================================================

                var swimmingPools = L.geoJSON(
                    swimmingPoolsData,
                    {
                        pane: 'pointPane',
                        pointToLayer: function (feature, latlng) {
                            return L.marker(latlng, {
                                pane: 'pointPane',
                                icon: emojiDivIcon('🏊')
                            });
                        },
                        onEachFeature: function (feature, layer) {
                            var p = feature.properties;
                            layer.bindPopup(
                                "<b>Pool: </b>" + (p.POOL_NAME || "") +
                                "<br><b>Location: </b>" + (p.PARK_LOCATION || "N/A") +
                                "<br><b>Type: </b>" + (p.POOL_TYPE || "N/A") +
                                "<br><b>Address: </b>" + (p.ADDRESS_LINE1 || "") + ", " + (p.CITY || "") + " " + (p.ZIP || "") +
                                "<br><b>Phone: </b>" + (p.PHONE || "N/A")
                            );
                        }
                    }
                );


                // ========================================================
                // LIBRARIES
                // ========================================================

                var libraries = L.geoJSON(
                    librariesData,
                    {
                        pane: 'pointPane',
                        pointToLayer: function (feature, latlng) {
                            return L.marker(latlng, {
                                pane: 'pointPane',
                                icon: emojiDivIcon('📚')
                            });
                        },
                        onEachFeature: function (feature, layer) {
                            var p = feature.properties;
                            layer.bindPopup(
                                "<b>Library: </b>" + (p.LIBRARY_NAME || "") +
                                "<br><b>Address: </b>" + (p.ADDRESS_LINE1 || "") + ", " + (p.CITY || "") + " " + (p.ZIP || "")
                            );
                        }
                    }
                );


                // ========================================================
                // FIVE HIGHEST SVI CENSUS TRACTS
                // ========================================================

                var fiveHighestCensusTracts = L.geoJSON(
                    highestData,
                    {

                        pane: 'highlightPane',

                        style: {

                            color: "#A80000",

                            weight: 3,

                            opacity: 1,

                            fillColor: "#A80000",

                            fillOpacity: 0.7

                        },

                       onEachFeature: function (
    feature,
    layer
) {

    var p = feature.properties;
    var name = p.tract_name ? p.tract_name.split(";")[0] : (p.NAME || "");
    layer.bindPopup(
        "<b>Highest SVI Census Tract</b>" +
        "<br><b>Name: </b>" + name +
        "<br><b>SVI Score: </b>" + p.SVI.toFixed(2)
    );

}

                    }
                );


                // ========================================================
                // ADD INITIAL LAYERS TO MAP
                // ========================================================

                censusTracts.addTo(map);

                countyBoundary.addTo(map);

                traditionalSchools.addTo(map);

                alternativePathwaySchools.addTo(map);

                fiveHighestCensusTracts.addTo(map);

                neighborhoods.addTo(map);

                // Recreation Centers and SUD Facilities
                // are available in the layer control but
                // are OFF by default.


                if (censusTracts.getBounds().isValid()) {

                    map.fitBounds(
                        censusTracts.getBounds()
                    );

                }


                // ========================================================
                // INITIAL NEIGHBORHOOD LABEL PLACEMENT
                // ========================================================

                setTimeout(
                    updateNeighborhoodLabels,
                    100
                );


                // ========================================================
                // LAYER CONTROL
                // ========================================================


                // ========================================================
                // LAYER CONTROL
                // ========================================================

                L.control.layers(

                    {
                        "OpenStreetMap": osm
                    },

                    {
                        "Social Vulnerability Index (SVI)": censusTracts,
                        "  ↳ Highest SVI Tracts": fiveHighestCensusTracts,
                        "County Boundary": countyBoundary,
                        "Neighborhoods": neighborhoods,
                        "Traditional Schools": traditionalSchools,
                        "Alternative/Pathway Schools": alternativePathwaySchools,
                        "Recreation Centers": recreationCenters,
                        "SUD Facilities": sudFacilities,
                        "Farmers Markets": farmersMarkets,
                        "Parks": parks,
                        "Skate Parks": skateParks,
                        "Swimming Pools": swimmingPools,
                        "Libraries": libraries
                    },

                    {
                        position: 'topleft',
                        collapsed: false
                    }

                ).addTo(map);

                // ========================================================
                // LEGEND
                // ========================================================

                var legend = L.control({
                    position: 'bottomright'
                });


                legend.onAdd = function (map) {

                    var div = L.DomUtil.create(
                        'div',
                        'info legend'
                    );

                    return div;
                };


                legend.addTo(map);


                // ========================================================
                // UPDATE LEGEND
                // Changes automatically when layers are turned
                // on or off using the layer control.
                // ========================================================

                function updateLegend() {

                    var div = legend.getContainer();

                    div.innerHTML = '';


                    // ====================================================
                    // CENSUS TRACTS
                    // ====================================================

                    if (map.hasLayer(censusTracts)) {

                        div.innerHTML +=
                            '<div class="legend-section">' +
                            'Census Tracts - SVI Score' +
                            '</div>';


                        div.innerHTML +=
                            '<i style="background:#F5F500"></i>' +
                            'Low<br>';


                        div.innerHTML +=
                            '<i style="background:#F5B800"></i>' +
                            'Low - Moderate<br>';


                        div.innerHTML +=
                            '<i style="background:#F57A00"></i>' +
                            'Moderate<br>';


                        div.innerHTML +=
                            '<i style="background:#F53D00"></i>' +
                            'Moderate - High<br>';


                        div.innerHTML +=
                            '<i style="background:#F50000"></i>' +
                            'High<br>';
                    }


                    // ====================================================
                    // FIVE HIGHEST SVI CENSUS TRACTS
                    // ====================================================

                    if (map.hasLayer(fiveHighestCensusTracts)) {


                        div.innerHTML +=
                            '<i style="' +
                            'background:#A80000;' +
                            'border:1px solid #000000;' +
                            'width:18px;' +
                            'height:18px;' +
                            '"></i>' +
                            'Highest<br>';
                    }


                    // ====================================================
                    // SCHOOLS
                    // ====================================================

                    if (map.hasLayer(traditionalSchools) ||
                        map.hasLayer(alternativePathwaySchools)) {

                        div.innerHTML +=
                            '<div class="legend-section">' +
                            'Schools — SRI Score</div>';

                        div.innerHTML += '<div class="ramp-bar"></div>';

                        div.innerHTML +=
                            '<div class="ramp-labels">' +
                            '<span>Lower need</span>' +
                            '<span>Higher need</span>' +
                            '</div>';

                        div.innerHTML +=
                            '<i class="circle-symbol" style="' +
                            'background:#CCCCCC;' +
                            'border:3px solid #008000' +
                            '"></i>Large green border = Top 5 Traditional<br>';

                        div.innerHTML +=
                            '<i class="circle-symbol" style="' +
                            'background:#CCCCCC;' +
                            'border:3px solid #800080' +
                            '"></i>Large purple border = Top 5 Alternative<br>';
                    }


                    // ====================================================
                    // COUNTY BOUNDARY
                    // ====================================================

                    if (map.hasLayer(countyBoundary)) {

                        div.innerHTML +=
                            '<div class="legend-section">' +
                            'Boundaries' +
                            '</div>';


                        div.innerHTML +=
                            '<i class="line-symbol" ' +
                            'style="border-color:#000000; ' +
                            'border-top-width:3px">' +
                            '</i>' +
                            'County Boundary<br>';
                    }


                    // ====================================================
                    // NEIGHBORHOODS
                    // ====================================================

                    if (map.hasLayer(neighborhoods)) {

                        if (!map.hasLayer(countyBoundary)) {

                            div.innerHTML +=
                                '<div class="legend-section">' +
                                'Boundaries' +
                                '</div>';
                        }


                        div.innerHTML +=
                            '<i class="line-symbol" ' +
                            'style="border-color:#000000; ' +
                            'border-top-width:2px">' +
                            '</i>' +
                            'Neighborhood Boundary<br>';
                    }


                    // ====================================================
                    // RECREATION CENTERS
                    // Protective Layer
                    // ====================================================

                    if (map.hasLayer(recreationCenters)) {

                        div.innerHTML +=
                            '<div class="legend-section">' +
                            'Community Resources' +
                            '</div>';


                        div.innerHTML +=
                            '🌟 Recreation Centers<br>';
                    }


                    // ====================================================
                    // SUD FACILITIES
                    // Protective Layer
                    // ====================================================

                    if (map.hasLayer(sudFacilities)) {

                        if (!map.hasLayer(recreationCenters)) {

                            div.innerHTML +=
                                '<div class="legend-section">' +
                                'Community Resources' +
                                '</div>';
                        }


                        div.innerHTML +=
                            '🏢 SUD Facilities<br>';
                    }


                    // ====================================================
                    // FARMERS MARKETS
                    // Protective Layer
                    // ====================================================

                    if (map.hasLayer(farmersMarkets)) {

                        if (!map.hasLayer(recreationCenters) &&
                            !map.hasLayer(sudFacilities)) {

                            div.innerHTML +=
                                '<div class="legend-section">' +
                                'Community Resources' +
                                '</div>';
                        }


                        div.innerHTML +=
                            '🥕 Farmers Markets<br>';
                    }


                    // ====================================================
                    // SKATE PARKS
                    // Protective Layer
                    // ====================================================

                    if (map.hasLayer(skateParks)) {

                        if (!map.hasLayer(recreationCenters) &&
                            !map.hasLayer(sudFacilities) &&
                            !map.hasLayer(farmersMarkets)) {

                            div.innerHTML +=
                                '<div class="legend-section">' +
                                'Community Resources' +
                                '</div>';
                        }


                        div.innerHTML +=
                            '🛹 Skate Parks<br>';
                    }


                    // ====================================================
                    // SWIMMING POOLS
                    // Community Resource
                    // ====================================================

                    if (map.hasLayer(swimmingPools)) {

                        if (!map.hasLayer(recreationCenters) &&
                            !map.hasLayer(sudFacilities) &&
                            !map.hasLayer(farmersMarkets) &&
                            !map.hasLayer(skateParks)) {

                            div.innerHTML +=
                                '<div class="legend-section">' +
                                'Community Resources' +
                                '</div>';
                        }


                        div.innerHTML +=
                            '🏊 Swimming Pools<br>';
                    }


                    // ====================================================
                    // LIBRARIES
                    // Community Resource
                    // ====================================================

                    if (map.hasLayer(libraries)) {

                        if (!map.hasLayer(recreationCenters) &&
                            !map.hasLayer(sudFacilities) &&
                            !map.hasLayer(farmersMarkets) &&
                            !map.hasLayer(skateParks) &&
                            !map.hasLayer(swimmingPools)) {

                            div.innerHTML +=
                                '<div class="legend-section">' +
                                'Community Resources' +
                                '</div>';
                        }


                        div.innerHTML +=
                            '📚 Libraries<br>';
                    }


                    // ====================================================
                    // CENSUS TRACT BOUNDARY
                    // ====================================================
                    // This is always included with Census Tracts.
                    // It is intentionally not given its own legend
                    // symbol because the SVI colors already explain
                    // the Census Tract layer.
                    // ====================================================


                }


                // ========================================================
                // INITIAL LEGEND
                // Shows all layers that are currently displayed.
                // ========================================================

                updateLegend();


                // ========================================================
                // UPDATE LEGEND WHEN A LAYER IS TURNED ON
                // ========================================================

                map.on('overlayadd', function () {

                    updateLegend();

                });


                // ========================================================
                // UPDATE LEGEND WHEN A LAYER IS TURNED OFF
                // ========================================================

                map.on('overlayremove', function () {

                    updateLegend();

                });


                console.log(
                    "Map layers and legend successfully created."
                );

            })


            // ============================================================
            // ERROR HANDLING
            // ============================================================

            .catch(function (error) {

                console.error(
                    "ERROR LOADING MAP DATA:",
                    error
                );

            });

    </script>

</body>

</html>
